<title>AI deep dive</title>
<!--
  Šablona prezentace ai-bootcamp-mastermind. Funguje sama: otevři v prohlížeči, listuj šipkami.
  Agent mění JEN obsah datového bloku (script s id "data", formát: reference/temata.md).
  Vkládej skriptem scripts/vloz.mjs (escapuje znak menší-než, ať text v datech neukončí blok).
  Žádné externí zdroje; všechen text se vkládá přes textContent.
-->
<style>
:root {
  --bg: #12131a; --panel: #1b1d27; --line: #2c2f3d; --text: #ecedf3; --muted: #9a9db0;
  --accent: #e8875b; --accent-soft: color-mix(in srgb, var(--accent) 18%, transparent);
  --font: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
:root[data-theme="svetla"] {
  --bg: #f6f5f1; --panel: #ffffff; --line: #e2e0d8; --text: #1d1e24; --muted: #6a6c78;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { overflow: hidden; }
.slide {
  position: absolute; inset: 0; display: none; flex-direction: column;
  padding: clamp(20px, 5vh, 56px) clamp(16px, 6vw, 88px) 72px; overflow-y: auto;
}
.slide.aktivni { display: flex; }
.kicker { color: var(--accent); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 600; }
h1 { font-size: clamp(36px, 6vw, 72px); line-height: 1.05; margin: 12px 0 8px; }
h2 { font-size: clamp(26px, 3.6vw, 44px); line-height: 1.1; margin: 8px 0 12px; }
.role { color: var(--muted); font-size: clamp(16px, 2vw, 22px); }
.lead {
  font-size: clamp(17px, 2vw, 23px); line-height: 1.4; margin: 0 0 24px; max-width: 60ch;
  border-left: 4px solid var(--accent); padding-left: 14px;
}
.titul { justify-content: center; }
.titul .veta { font-size: clamp(20px, 2.6vw, 30px); max-width: 30ch; margin-top: 28px; line-height: 1.3; }
.bloky { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }
.blok { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px; min-width: 0; }
.blok p { margin: 0; line-height: 1.5; font-size: 17px; }
.blok ul { margin: 0; padding-left: 20px; line-height: 1.6; font-size: 17px; }
.cipy { display: flex; flex-wrap: wrap; gap: 8px; }
.cip { background: var(--accent-soft); border: 1px solid color-mix(in srgb, var(--accent) 45%, transparent); border-radius: 999px; padding: 5px 12px; font-size: 15px; }
.stat .hodnota { font-size: clamp(40px, 6vw, 68px); font-weight: 700; color: var(--accent); line-height: 1; }
.stat .popis { color: var(--muted); margin-top: 8px; font-size: 16px; }
.bar { display: grid; grid-template-columns: minmax(80px, 34%) 1fr auto; gap: 10px; align-items: center; margin: 7px 0; font-size: 15px; }
.bar .stopa { background: var(--line); border-radius: 6px; height: 12px; overflow: hidden; }
.bar .vypln { background: var(--accent); height: 100%; border-radius: 6px; }
.bar .cislo { color: var(--muted); font-variant-numeric: tabular-nums; }
.heat { display: grid; grid-template-columns: 26px repeat(24, 1fr); gap: 3px; font-size: 11px; color: var(--muted); }
.heat .bunka { aspect-ratio: 1; border-radius: 3px; background: var(--accent); }
.heat .nula { background: var(--line); }
.tok { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.tok .krok { background: var(--accent-soft); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; font-size: 15px; }
.tok .sipka { color: var(--accent); font-size: 20px; }
.chat { display: flex; flex-direction: column; gap: 10px; }
.bublina { max-width: 85%; padding: 10px 14px; border-radius: 14px; font-size: 15px; line-height: 1.45; white-space: pre-wrap; }
.bublina.ja { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
.bublina.ai { align-self: flex-start; background: var(--line); border-bottom-left-radius: 4px; }
.bublina .kdo { display: block; font-size: 11px; opacity: .75; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .06em; }
.kod .stitek { color: var(--muted); font-size: 13px; margin-bottom: 8px; }
.kod pre { margin: 0; font-family: var(--mono); font-size: 14px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
.osa { list-style: none; margin: 0; padding: 0; border-left: 2px solid var(--line); }
.osa li { position: relative; padding: 0 0 12px 16px; font-size: 15px; line-height: 1.45; }
.osa li::before { content: ""; position: absolute; left: -6px; top: 6px; width: 10px; height: 10px; border-radius: 50%; background: var(--accent); }
.osa .kdy { color: var(--muted); font-size: 13px; display: block; }
.zaver .bloky h3 { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
.lista { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 20px; color: var(--muted); font-size: 13px; }
.lista button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 36px; height: 30px; cursor: pointer; font-size: 16px; }
.lista .postup { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }
.lista .postup span { display: block; height: 100%; background: var(--accent); }
@media (max-width: 640px) { .bar { grid-template-columns: 1fr auto; } .bar .stopa { grid-column: 1 / -1; grid-row: 2; } }
@media print {
  body { overflow: visible; } .lista { display: none; }
  .slide { position: relative; display: flex !important; min-height: 100vh; page-break-after: always; overflow: visible; }
}
</style>

<script id="rozdeleni">
// Čistá funkce bez DOM: z dat udělá seznam slidů. Testuje se v tests/sablona.test.mjs.
function rozdelNaSlidy(data) {
  var MAX_BLOKU = 3;
  var neprazdne = function (x) { return Array.isArray(x) && x.length > 0; };
  var maObsah = function (b) {
    if (!b || typeof b !== "object") return false;
    switch (b.type) {
      case "text": case "code": return typeof b.text === "string" && b.text.trim() !== "";
      case "list": case "chips": case "bars": case "timeline": return neprazdne(b.items);
      case "flow": return neprazdne(b.steps);
      case "conversation": return neprazdne(b.messages);
      case "stat": return b.value !== undefined && b.value !== null && String(b.value) !== "";
      case "heatmap": return neprazdne(b.data) && b.data.some(function (r) { return neprazdne(r) && r.some(function (v) { return v > 0; }); });
      default: return false;
    }
  };
  var slidy = [{ typ: "titul" }];
  (data.sections || []).forEach(function (s) {
    var bloky = (s.blocks || []).filter(maObsah);
    for (var i = 0; i < bloky.length; i += MAX_BLOKU) slidy.push({ typ: "sekce", sekce: s, bloky: bloky.slice(i, i + MAX_BLOKU) });
  });
  var z = data.closing || {};
  if (neprazdne(z.ask) || neprazdne(z.takeaways)) slidy.push({ typ: "zaver" });
  return slidy;
}
</script>

<script>
(function () {
  var data = JSON.parse(document.getElementById("data").textContent);
  var meta = data.meta || {};
  var koren = document.documentElement;
  if (meta.theme === "svetla") koren.setAttribute("data-theme", "svetla");
  if (/^#[0-9a-fA-F]{6}$/.test(meta.accent || "")) koren.style.setProperty("--accent", meta.accent);
  if (meta.name) document.title = meta.name + " · AI deep dive";

  function el(tag, trida, text) {
    var e = document.createElement(tag);
    if (trida) e.className = trida;
    if (text !== undefined && text !== null) e.textContent = String(text);
    return e;
  }

  var DNY = ["Po", "Út", "St", "Čt", "Pá", "So", "Ne"];
  var BLOKY = {
    text: function (b, box) { box.appendChild(el("p", null, b.text)); },
    list: function (b, box) { var ul = el("ul"); b.items.forEach(function (x) { ul.appendChild(el("li", null, x)); }); box.appendChild(ul); },
    chips: function (b, box) { var w = el("div", "cipy"); b.items.forEach(function (x) { w.appendChild(el("span", "cip", x)); }); box.appendChild(w); },
    stat: function (b, box) { box.classList.add("stat"); box.appendChild(el("div", "hodnota", b.value)); if (b.label) box.appendChild(el("div", "popis", b.label)); },
    bars: function (b, box) {
      var max = Math.max.apply(null, b.items.map(function (x) { return Number(x[1]) || 0; })) || 1;
      b.items.forEach(function (x) {
        var r = el("div", "bar"); r.appendChild(el("span", null, x[0]));
        var st = el("div", "stopa"), v = el("div", "vypln"); v.style.width = Math.round((Number(x[1]) || 0) * 100 / max) + "%";
        st.appendChild(v); r.appendChild(st); r.appendChild(el("span", "cislo", x[1])); box.appendChild(r);
      });
    },
    heatmap: function (b, box) {
      var max = 0; b.data.forEach(function (r) { r.forEach(function (v) { if (v > max) max = v; }); });
      var g = el("div", "heat"); g.setAttribute("role", "img"); g.setAttribute("aria-label", "Aktivita podle dne a hodiny");
      g.appendChild(el("span"));
      for (var h = 0; h < 24; h++) g.appendChild(el("span", null, h % 6 === 0 ? h : ""));
      b.data.forEach(function (r, d) {
        g.appendChild(el("span", null, DNY[d] || ""));
        for (var h = 0; h < 24; h++) {
          var v = Number(r[h]) || 0, c = el("span", v ? "bunka" : "bunka nula");
          if (v) c.style.opacity = (0.25 + 0.75 * v / max).toFixed(2);
          c.title = (DNY[d] || "") + " " + h + ":00 · " + v; g.appendChild(c);
        }
      });
      box.appendChild(g);
    },
    flow: function (b, box) {
      var w = el("div", "tok");
      b.steps.forEach(function (x, i) { if (i) w.appendChild(el("span", "sipka", "→")); w.appendChild(el("span", "krok", x)); });
      box.appendChild(w);
    },
    conversation: function (b, box) {
      var w = el("div", "chat");
      b.messages.forEach(function (m) {
        var ja = m.who === "ja", bub = el("div", "bublina " + (ja ? "ja" : "ai"));
        bub.appendChild(el("span", "kdo", ja ? "já" : "AI")); bub.appendChild(document.createTextNode(m.text || "")); w.appendChild(bub);
      });
      box.appendChild(w);
    },
    code: function (b, box) { box.classList.add("kod"); if (b.label) box.appendChild(el("div", "stitek", b.label)); box.appendChild(el("pre", null, b.text)); },
    timeline: function (b, box) {
      var ul = el("ul", "osa");
      b.items.forEach(function (x) { var li = el("li"); li.appendChild(el("span", "kdy", x.when)); li.appendChild(document.createTextNode(x.what || "")); ul.appendChild(li); });
      box.appendChild(ul);
    }
  };

  var slidy = rozdelNaSlidy(data), main = document.getElementById("slidy"), cisloSekce = 0, minula = null;
  var uzly = slidy.map(function (s) {
    var sl = el("section", "slide");
    if (s.typ === "titul") {
      sl.classList.add("titul");
      sl.appendChild(el("div", "kicker", "AI deep dive · mastermind"));
      sl.appendChild(el("h1", null, meta.name || ""));
      if (meta.role) sl.appendChild(el("div", "role", meta.role));
      if (meta.tools && meta.tools.length) { var c = el("div", "cipy"); c.style.marginTop = "20px"; meta.tools.forEach(function (t) { c.appendChild(el("span", "cip", t)); }); sl.appendChild(c); }
      if (meta.sentence) sl.appendChild(el("p", "veta", meta.sentence));
    } else if (s.typ === "sekce") {
      if (s.sekce !== minula) { cisloSekce++; minula = s.sekce; }
      sl.appendChild(el("div", "kicker", String(cisloSekce).padStart(2, "0")));
      sl.appendChild(el("h2", null, s.sekce.title || ""));
      if (s.sekce.lead) sl.appendChild(el("p", "lead", s.sekce.lead));
      var w = el("div", "bloky");
      s.bloky.forEach(function (b) { var box = el("div", "blok"); BLOKY[b.type](b, box); w.appendChild(box); });
      sl.appendChild(w);
    } else {
      var z = data.closing || {};
      sl.classList.add("zaver");
      sl.appendChild(el("div", "kicker", "Na závěr"));
      sl.appendChild(el("h2", null, "Pojďme to probrat"));
      var w2 = el("div", "bloky");
      [["S čím chci poradit", z.ask], ["Co si odnést", z.takeaways]].forEach(function (p) {
        if (!p[1] || !p[1].length) return;
        var box = el("div", "blok"); box.appendChild(el("h3", null, p[0]));
        var ul = el("ul"); p[1].forEach(function (x) { ul.appendChild(el("li", null, x)); }); box.appendChild(ul); w2.appendChild(box);
      });
      sl.appendChild(w2);
    }
    main.appendChild(sl);
    return sl;
  });

  var i = 0;
  function ukaz(n) {
    i = Math.max(0, Math.min(uzly.length - 1, n));
    uzly.forEach(function (u, k) { u.classList.toggle("aktivni", k === i); });
    document.getElementById("pocitadlo").textContent = (i + 1) + " / " + uzly.length;
    document.getElementById("postup").style.width = ((i + 1) * 100 / uzly.length) + "%";
    if (location.hash !== "#" + (i + 1)) history.replaceState(null, "", "#" + (i + 1));
  }
  document.addEventListener("keydown", function (e) {
    if (["ArrowRight", "ArrowDown", "PageDown", " ", "Enter"].indexOf(e.key) >= 0) { e.preventDefault(); ukaz(i + 1); }
    else if (["ArrowLeft", "ArrowUp", "PageUp", "Backspace"].indexOf(e.key) >= 0) { e.preventDefault(); ukaz(i - 1); }
    else if (e.key === "Home") ukaz(0);
    else if (e.key === "End") ukaz(uzly.length - 1);
  });
  document.getElementById("dal").onclick = function () { ukaz(i + 1); };
  document.getElementById("zpet").onclick = function () { ukaz(i - 1); };
  main.addEventListener("click", function (e) {
    if (String(window.getSelection()) || e.target.closest("button")) return;
    ukaz(e.clientX > window.innerWidth / 3 ? i + 1 : i - 1);
  });
  window.addEventListener("hashchange", function () { ukaz((parseInt(location.hash.slice(1), 10) || 1) - 1); });
  ukaz((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
