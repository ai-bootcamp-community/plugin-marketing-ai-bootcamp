:root {

}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: var(--font); }
body { overflow: hidden; }

h1 { font-size: clamp(36px, 6vw, 72px); line-height: 1.05; margin: 12px 0 8px; }
h2 { font-size: clamp(26px, 3.6vw, 44px); line-height: 1.1; margin: 8px 0 12px; }
.role { color: var(--muted); font-size: clamp(16px, 2vw, 22px); }
.lead {

}
.titul { justify-content: center; }
.titul .veta { font-size: clamp(20px, 2.6vw, 30px); max-width: 30ch; margin-top: 28px; line-height: 1.3; }
.bloky { display: grid; gap: 18px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr)); align-items: start; }

.bublina.ai { align-self: flex-start; background: var(--line); border-bottom-left-radius: 4px; }

.osa .kdy { color: var(--muted); font-size: 13px; display: block; }
.blok-nadpis { color: var(--muted); font-size: 13px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 10px; }
.blok.velky { grid-column: 1 / -1; }
.graf svg { width: 100%; height: auto; max-height: 40vh; display: block; margin: 0 auto; }
.graf .uzel rect, .graf .uzel polygon { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 1.5; }
.graf .uzel text { fill: var(--text); font-size: 14px; font-family: var(--font); }
.graf .hrana { stroke: var(--muted); stroke-width: 1.5; fill: none; }
.graf .hrana.carkovana { stroke-dasharray: 5 4; }
.graf .popisek { fill: var(--muted); font-size: 12px; font-family: var(--font); }
.graf .sipka-hrot { fill: var(--muted); }
.tabulka { width: 100%; border-collapse: collapse; font-size: 15px; }
.tabulka th { text-align: left; color: var(--muted); font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); padding: 6px 10px 8px 0; }
.tabulka td { border-bottom: 1px solid var(--line); padding: 8px 10px 8px 0; vertical-align: top; line-height: 1.4; }
.tabulka tr:last-child td { border-bottom: 0; }
.tabulka td:first-child { font-weight: 600; }
.strom, .strom ul { list-style: none; margin: 0; padding: 0; }
.strom ul { margin-left: 10px; padding-left: 16px; border-left: 1px dashed var(--line); }
.strom li { padding: 4px 0; font-size: 15px; line-height: 1.35; }
.strom .jmeno { font-weight: 600; }
.strom .jmeno::before { content: "▸ "; color: var(--accent); }
.strom .pozn { color: var(--muted); font-size: 13px; margin-left: 8px; }
.zaver .bloky h3 { margin: 0 0 10px; font-size: 18px; color: var(--accent); }
.lista { position: fixed; left: 0; right: 0; bottom: 0; height: 52px; display: flex; align-items: center; gap: 14px; padding: 0 20px; color: var(--muted); font-size: 13px; }
.lista button { background: none; border: 1px solid var(--line); color: var(--text); border-radius: 8px; width: 36px; height: 30px; cursor: pointer; font-size: 16px; }
.lista .postup { flex: 1; height: 3px; background: var(--line); border-radius: 2px; overflow: hidden; }

@media (max-width: 640px) { .bar { grid-template-columns: 1fr auto; } .bar .stopa { grid-column: 1 / -1; grid-row: 2; } }
@media print {

  .slide { position: relative; display: flex !important; min-height: 100vh; page-break-after: always; overflow: visible; }

<script id="rozdeleni">
// Čistá funkce bez DOM: z dat udělá seznam slidů. Testuje se v tests/sablona.test.mjs.
function rozdelNaSlidy(data) {
  var MAX_BLOKU = 3;
  var neprazdne = function (x) { return Array.isArray(x) && x.length > 0; };
  var VELKE = { mermaid: true, table: true, tree: true }; // zaberou půl slidu: max 1 velký + 1 malý
  var maObsah = function (b) {
    if (!b || typeof b !== "object") return false;
    switch (b.type) {
      case "text": case "code": case "mermaid": return typeof b.text === "string" && b.text.trim() !== "";
      case "table": return neprazdne(b.rows);
      case "list": case "chips": case "bars": case "timeline": case "tree": return neprazdne(b.items);
      case "flow": return neprazdne(b.steps);
      case "conversation": return neprazdne(b.messages);
      case "stat": return b.value !== undefined && b.value !== null && String(b.value) !== "";
      case "heatmap": return neprazdne(b.data) && b.data.some(function (r) { return neprazdne(r) && r.some(function (v) { return v > 0; }); });
      default: return false;
    }
  };
  var slidy = [{ typ: "titul" }];
  (data.sections || []).forEach(function (s) {
    // Váha: malý blok 1, velký 2; slide unese 3 a nejvýš jeden velký blok.
    var aktualni = [], vaha = 0, maVelky = false;
    (s.blocks || []).filter(maObsah).forEach(function (b) {
      var velky = !!VELKE[b.type], w = velky ? 2 : 1;
      if (aktualni.length && (vaha + w > MAX_BLOKU || (velky && maVelky))) {
        slidy.push({ typ: "sekce", sekce: s, bloky: aktualni });
        aktualni = []; vaha = 0; maVelky = false;
      }
      aktualni.push(b); vaha += w; maVelky = maVelky || velky;
    });
    if (aktualni.length) slidy.push({ typ: "sekce", sekce: s, bloky: aktualni });
  });
  var z = data.closing || {};
  if (neprazdne(z.ask) || neprazdne(z.takeaways)) slidy.push({ typ: "zaver" });
  return slidy;
}
</script>

<script id="mermaid">
// Podmnožina mermaid (flowchart/graph): uzly A[..] A(..) A{..}, šipky --> -.-> ==> --- s popiskem |..|.
// Čistá funkce bez DOM; vrací null, když syntaxi nezná (blok se pak ukáže jako kód).
function parseMermaid(text) {
  if (typeof text !== "string") return null;
  var radky = text.split(/\n|;/).map(function (r) { return r.trim(); }).filter(function (r) { return r && r.indexOf("%%") !== 0; });
  if (!radky.length) return null;
  var hlavicka = /^(flowchart|graph)(?:\s+(LR|RL|TD|TB|BT))?\s*$/i.exec(radky[0]);
  if (!hlavicka) return null;
  var smer = /^(LR|RL)$/i.test(hlavicka[2] || "") ? "LR" : "TD";
  var UZEL = /^([\wÀ-ſ]+)\s*(?:\[([^\]]*)\]|\(([^)]*)\)|\{([^}]*)\})?/;
  var SIPKA = /^\s*(-\.->|-->|==>|---|-\.-)\s*(?:\|([^|]*)\|)?\s*/;
  var uzly = [], podleId = {}, hrany = [];
  var bezUvozovek = function (t) { t = t.trim(); return /^".*"$/.test(t) ? t.slice(1, -1) : t; };
  function uzel(m) {
    var id = m[1], label = null, tvar = "obdelnik";
    if (m[2] !== undefined) label = m[2];
    else if (m[3] !== undefined) { label = m[3]; tvar = "kulaty"; }
    else if (m[4] !== undefined) { label = m[4]; tvar = "kosoctverec"; }
    if (!podleId[id]) { podleId[id] = { id: id, label: id, tvar: "obdelnik" }; uzly.push(podleId[id]); }
    if (label !== null) { podleId[id].label = bezUvozovek(label); podleId[id].tvar = tvar; }
    return id;
  }
  for (var i = 1; i < radky.length; i++) {
    var r = radky[i];
    if (/^(style|classDef|class|linkStyle|click|subgraph|end|direction)\b/.test(r)) continue;
    var m = UZEL.exec(r);
    if (!m) return null;
    var pred = uzel(m), zbytek = r.slice(m[0].length);
    while (zbytek.trim()) {
      var s = SIPKA.exec(zbytek);
      if (!s) return null;
      zbytek = zbytek.slice(s[0].length);
      m = UZEL.exec(zbytek);
      if (!m) return null;
      var dalsi = uzel(m);
      hrany.push({ z: pred, do: dalsi, label: (s[2] || "").trim(), carkovana: s[1].indexOf(".") >= 0 });
      pred = dalsi; zbytek = zbytek.slice(m[0].length);
    }
  }
  return uzly.length ? { smer: smer, uzly: uzly, hrany: hrany } : null;
}
</script>
